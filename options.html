<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Hellowork AutoApply - Options</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }
    .wrap {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .panel {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }
    h1 { margin: 0 0 14px; font-size: 22px; }
    h2 { margin: 0 0 10px; font-size: 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
    }
    input, textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 9px;
      font-size: 13px;
    }
    label {
      font-size: 12px;
      display: block;
      margin-bottom: 4px;
      color: #4b5563;
    }
    button {
      border: 0;
      background: #fb7185;
      color: white;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    #toast {
      margin-left: 10px;
      font-size: 13px;
      color: #059669;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Hellowork AutoApply - Options</h1>

    <div class="panel">
      <h2>Profil candidat</h2>
      <div class="grid">
        <div><label>Nom complet</label><input id="fullName" /></div>
        <div><label>Email</label><input id="email" /></div>
        <div><label>Telephone</label><input id="phone" /></div>
        <div><label>Localisation</label><input id="location" /></div>
      </div>
    </div>

    <div class="panel">
      <h2>Reglages automation</h2>
      <div class="grid">
        <div><label>Max jobs/session</label><input id="maxJobsPerSession" type="number" min="1" max="100" /></div>
        <div><label>Delai jobs min (ms)</label><input id="delayJobMin" type="number" min="1000" /></div>
        <div><label>Delai jobs max (ms)</label><input id="delayJobMax" type="number" min="1000" /></div>
        <div><label>Delai etapes min (ms)</label><input id="delayStepMin" type="number" min="100" /></div>
        <div><label>Delai etapes max (ms)</label><input id="delayStepMax" type="number" min="100" /></div>
        <div><label>Pages consecutives sans apply avant stop</label><input id="maxNoApplyPages" type="number" min="1" max="5" /></div>
      </div>
    </div>

    <div class="panel">
      <button id="saveBtn">Sauvegarder</button>
      <span id="toast"></span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
